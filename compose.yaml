services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: compendium-local-dev-key-not-a-production-secret
      DATABASE_URL: postgresql://compendium:compendium@database:5432/compendium?serverVersion=16&charset=utf8
      ELASTICSEARCH_URL: http://elasticsearch:9200
      LOCAL_ADMIN_EMAIL: admin@compendium.local
      GOOGLE_DRIVE_ENABLED: "0"
      DEFAULT_URI: http://localhost:8080
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_NAME: Compendium
      WEBAUTHN_ORIGIN: http://localhost:8080
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      database:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: compendium
      POSTGRES_USER: compendium
      POSTGRES_PASSWORD: compendium
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compendium -d compendium"]
      interval: 3s
      timeout: 3s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
  elasticsearch_data:
  vendor:
