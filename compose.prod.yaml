name: compendium
services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    env_file: /etc/compendium/compendium.env
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
    restart: unless-stopped
    depends_on:
      database: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 30s
      timeout: 5s
      retries: 3
  nginx:
    image: nginx:1.29-alpine
    ports: ["127.0.0.1:3031:80"]
    restart: unless-stopped
    depends_on:
      php: {condition: service_healthy}
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
  database:
    image: postgres:16-alpine
    env_file: /etc/compendium/compendium.env
    restart: unless-stopped
    volumes: [compendium_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    restart: unless-stopped
    volumes: [compendium_elasticsearch:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
volumes:
  compendium_postgres:
  compendium_elasticsearch:
